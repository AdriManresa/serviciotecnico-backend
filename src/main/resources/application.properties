spring.application.name=serviciotecnico
# Le decimos que se conecte a la base local llamada "serviciotecnico"
spring.datasource.url=jdbc:mysql://localhost:3306/serviciotecnico

# En Linux Mint, usando sudo, el usuario por defecto es root sin contraseña en local
spring.datasource.username=adri
spring.datasource.password=admin123

# Esta línea es la magia de JPA: le dice a Hibernate que cree o actualice las tablas de Java automáticamente en la base de datos
spring.jpa.hibernate.ddl-auto=update

# Para poder ver en la consola las consultas SQL que Spring hace por detrás
spring.jpa.show-sql=true